name: Publish npm package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify version and select npm dist-tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs >> "$GITHUB_OUTPUT"
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Pack release artifact
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
      - name: Check release artifact
        run: npm run test:package -- ./artifacts/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/*.tgz
      - name: Publish validated artifact
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm publish ./artifacts/*.tgz --access public --tag "$NPM_DIST_TAG"
